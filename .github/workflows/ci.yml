name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-15
            artifact: plume-macos-unsigned
            bundle-paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app
          - platform: Windows
            os: windows-2025
            artifact: plume-windows-unsigned
            bundle-paths: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Run performance regression suite
        run: npm run benchmark:regression

      - name: Check Rust
        run: npm run check:rust

      - name: Verify operating-system credential storage
        run: cargo test --manifest-path src-tauri/Cargo.toml system_store_supports_a_real_round_trip -- --ignored

      - name: Build unsigned desktop bundles
        run: npm run tauri build

      - name: Upload unsigned desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.bundle-paths }}
          if-no-files-found: error
          retention-days: 14

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: [14, 16, 18]

    env:
      PLUME_POSTGRES_VERSION: ${{ matrix.postgres }}
      PLUME_TEST_DATABASE_CONFIG: postgresql://plume:plume@localhost:55432/plume?sslmode=disable
      PLUME_TEST_SECONDARY_DATABASE: plume_secondary

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Start disposable PostgreSQL and SSH services
        run: npm run postgres:up

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run PostgreSQL, TLS, and SSH integration tests
        run: npm run test:postgres

      - name: Stop disposable integration services
        if: always()
        run: npm run postgres:down
