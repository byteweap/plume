name: Plume 1.0 Release Candidate

on:
  push:
    tags:
      - "v1.0.0-rc.*"

permissions:
  contents: read

env:
  CI: "true"

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate candidate tag and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release candidate
        run: npm run check:release:candidate -- --tag "$GITHUB_REF_NAME"

  macos:
    name: macOS unsigned candidate
    needs: validate
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: npm run check:all

      - name: Build unsigned universal macOS bundles
        run: npm run tauri -- build --target universal-apple-darwin --bundles app,dmg --ci --no-sign

      - name: Verify unsigned macOS bundles
        run: npm run verify:release:macos -- --bundle-root src-tauri/target/universal-apple-darwin/release/bundle --allow-unsigned

      - name: Upload unsigned macOS bundles
        uses: actions/upload-artifact@v7
        with:
          name: plume-macos-universal-unsigned
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows unsigned installer candidate
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run release gates
        run: npm run check:all

      - name: Build unsigned MSI and NSIS installers
        shell: pwsh
        run: |
          $msiVersion = (node scripts/windows-msi-version.mjs).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $releaseConfigPath = Join-Path $env:RUNNER_TEMP "tauri.windows.msi.conf.json"
          @{
            bundle = @{
              windows = @{
                wix = @{
                  version = $msiVersion
                }
              }
            }
          } | ConvertTo-Json -Compress -Depth 5 | Set-Content -Encoding utf8NoBOM -NoNewline -Path $releaseConfigPath
          npm run tauri -- build --config $releaseConfigPath --bundles msi,nsis --ci --no-sign
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify unsigned Windows installers
        run: >-
          npm run verify:release:windows --
          --bundle-root src-tauri/target/release/bundle
          --executable src-tauri/target/release/plume.exe
          --allow-unsigned

      - name: Test silent install and uninstall
        shell: pwsh
        run: ./scripts/test-windows-installers.ps1 -BundleRoot src-tauri/target/release/bundle -AllowUnsigned

      - name: Upload unsigned Windows installers
        uses: actions/upload-artifact@v7
        with:
          name: plume-windows-x64-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish unsigned pre-release
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download unsigned installers
        uses: actions/download-artifact@v8
        with:
          pattern: plume-*-unsigned*
          path: release-artifacts
          merge-multiple: true

      - name: Collect installers and generate checksums
        shell: bash
        run: |
          mkdir release-assets
          while IFS= read -r -d '' artifact; do
            cp "$artifact" release-assets/
          done < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) -print0)
          artifact_count="$(find release-assets -type f | wc -l | tr -d ' ')"
          if [ "$artifact_count" -ne 3 ]; then
            echo "::error::Expected one DMG, one MSI, and one NSIS installer; found $artifact_count files."
            exit 1
          fi
          (cd release-assets && shasum -a 256 * > SHA256SUMS)

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-assets/*
          --verify-tag
          --prerelease
          --title "Plume ${GITHUB_REF_NAME#v} unsigned"
          --notes-file RELEASE_NOTES.md
